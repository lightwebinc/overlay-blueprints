name: image-publish

# Manual, gated image publish. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    if: github.event.inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    steps:
      # Build from the git tag being published: input '0.2.0' -> tag 'v0.2.0'.
      # Checkout fails the run if that tag does not exist: push the git tag first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/v${{ github.event.inputs.tag }}

      # The arm64 image runs npm ci under emulation. Every production
      # dependency is plain JavaScript, so nothing is compiled there.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/overlay-blueprints:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/overlay-blueprints:latest
