name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7
        with:
          # Pinned to the RUNTIME major, which package.json also pins. The
          # engine package is published for current Node and the host is
          # deployed on 24; testing on anything else tests a host we do not run.
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: build
        run: npm run build
      - name: test
        run: npm test
      # LICENSE-THIRD-PARTY is generated from the production dependency tree,
      # so a new package that nobody notices is a licence obligation that
      # nobody notices. This fails the build instead. It runs after npm ci,
      # because it reads node_modules.
      - name: third-party licences are current
        run: python3 scripts/gen-third-party-licenses.py . --check
